apply plugin: 'com.android.application'

//
// build.gradle in TeamCode
//
// Most of the definitions for building your module reside in a common, shared
// file 'build.common.gradle'. Being factored in this way makes it easier to
// integrate updates to the FTC into your code. If you really need to customize
// the build definitions, you can place those customizations in this file, but
// please think carefully as to whether such customizations are really necessary
// before doing so.


// Custom definitions may go here

// Include common definitions from above.

buildscript {
    repositories {
        google()
        mavenCentral()
        maven {
            url "https://repo.dairy.foundation/releases"
        }
    }
    dependencies {
        classpath "dev.frozenmilk:Load:0.3.2"
    }
}

apply from: '../build.common.gradle'
apply from: '../build.dependencies.gradle'
apply plugin: 'dev.frozenmilk.sinister.sloth.load'


repositories {
    maven {
        url = "https://repo.dairy.foundation/releases"
    }
    maven {
        url = 'https://maven.brott.dev/'
    }
}

dependencies {
    implementation project(':FtcRobotController')

    implementation("dev.frozenmilk.sinister:Sloth:0.2.4")
//    implementation("dev.frozenmilk.sinister:Sloth:0.3.2")
    implementation("com.acmerobotics.slothboard:dashboard:0.2.4+0.4.17")
//    implementation("com.acmerobotics.slothboard:dashboard:0.3.2+0.6.0")
    implementation("com.bylazar.sloth:fullpanels:0.2.4+1.0.12")
//    implementation("com.bylazar.sloth:fullpanels:0.3.2+1.0.13")
    implementation 'com.pedropathing:ftc:2.0.4'
    implementation 'com.pedropathing:telemetry:1.0.0'
    implementation ("com.acmerobotics.roadrunner:ftc:0.1.25"){
        exclude group: "com.acmerobotics.dashboard"
    }
    implementation ("com.acmerobotics.roadrunner:core:1.0.1"){
        exclude group: "com.acmerobotics.dashboard"
    }
    implementation ("com.acmerobotics.roadrunner:actions:1.0.1"){
        exclude group: "com.acmerobotics.dashboard"
    }
//    implementation 'com.google.android.libraries.ads.mobile.sdk:ads-mobile-sdk:0.24.0-beta01'

//    implementation "com.acmerobotics.dashboard:dashboard:0.5.0"
}

android {
    namespace = 'org.firstinspires.ftc.teamcode'

    packagingOptions {
        jniLibs.useLegacyPackaging true
    }
    // The prebuilt FTC SDK native libraries (RobotCore, EasyOpenCV, AprilTag, OpenCV, etc.)
    // are not 16 KB page-aligned for arm64-v8a. The Control Hub is 32-bit (armeabi-v7a), so
    // ship only 32-bit native libs to avoid the 16 KB page-size incompatibility.
    buildTypes.all { buildType ->
        buildType.ndk.abiFilters.clear()
        buildType.ndk.abiFilters 'armeabi-v7a'
    }
}

//dependencies {
//    implementation project(':FtcRobotController')
//}
dependencies {
    implementation 'org.openftc:apriltag:2.1.0'
    implementation 'org.firstinspires.ftc:Vision:10.3.0'
    //implementation 'com.acmerobotics.dashboard:dashboard:0.5.1'
}
